# infotennis_v2 Configuration
# Non-sensitive settings for the cloud ELT pipeline

# ATP Scraping
atp:
  root_url: "https://www.atptour.com"
  results_archive_path: "/en/scores/results-archive"
  hawkeye_url_template: "https://www.atptour.com/-/Hawkeye/MatchStats/Complete/%(year)s/%(tourn_id)s/%(match_id)s"

# Infosys Match Stats API
infosys:
  endpoints:
    key-stats: "https://itp-atp-sls.infosys-platforms.com/static/prod/stats-plus/%(year)s/%(tourn_id)s/%(match_id)s/keystats.json"
    rally-analysis: "https://itp-atp-sls.infosys-platforms.com/static/prod/rally-analysis/%(year)s/%(tourn_id)s/%(match_id)s/data.json"
    stroke-analysis: "https://itp-atp-sls.infosys-platforms.com/static/prod/stroke-analysis/v2/%(year)s/%(tourn_id)s/%(match_id)s/data.json"
    court-vision: "https://itp-atp-sls.infosys-platforms.com/static/prod/court-vision/%(year)s/%(tourn_id)s/%(match_id)s/data.json"

# S3 Storage
s3:
  default_bucket: "infotennis-v2"
  raw_prefix: "raw"
  timestamp_format: "%Y%m%d_%H%M%S"
  paths:
    atp_results_archive: "raw/atp_results_archive/incoming/year=%(year)s/atp_calendar_%(year)s_%(timestamp)s.json"
    atp_tournaments: "raw/atp_tournaments/incoming/year=%(year)s/atp_tournaments_%(year)s_%(timestamp)s.json"
    atp_tournament: "raw/atp_tournament/year=%(year)s/tourn=%(tournament_id)s/atp_tournament_results_%(year)s_%(tournament_id)s_%(timestamp)s.json"
    match_info: "raw/match_info/year=%(year)s/tourn=%(tourn_id)s/%(match_id)s_%(match_name)s_%(timestamp)s.json"
    key_stats: "raw/key_stats/year=%(year)s/tourn=%(tourn_id)s/%(match_id)s_%(match_name)s_%(timestamp)s.json"
    stroke_analysis: "raw/stroke_analysis/year=%(year)s/tourn=%(tourn_id)s/%(match_id)s_%(match_name)s_%(timestamp)s.json"
    rally_analysis: "raw/rally_analysis/year=%(year)s/tourn=%(tourn_id)s/%(match_id)s_%(match_name)s_%(timestamp)s.json"
    court_vision: "raw/court_vision/year=%(year)s/tourn=%(tourn_id)s/%(match_id)s_%(match_name)s_%(timestamp)s.json"

# MotherDuck
motherduck:
  default_database: "infotennis_v2_raw"
  tables:
    atp_results_archive: "atp_calendar"
    atp_tournaments: "atp_tournaments"
    atp_tournament_results: "atp_tournament_results"
    match_info: "atp_match_info"
    key_stats: "atp_key_stats"
    stroke_analysis: "atp_stroke_analysis"
    rally_analysis: "atp_rally_analysis"
    court_vision: "atp_court_vision"
