version: 2

models:
  - name: fct_atp_calendar
    description: >
      Entity fact table for the complete ATP calendar.
      Deduplicates tournaments to the most recently scraped record for each year + tournament_id combination.
      Parses full date strings into concrete start_date and end_date columns.
    columns:
      - name: year
        description: "Tournament year"
      - name: tournament_id
        description: "ATP unique tournament identifier"
      - name: start_date
        description: "Starting date of the tournament"
      - name: end_date
        description: "Ending date of the tournament"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id"

  - name: fct_atp_tournament_results
    description: >
      Entity fact table for match results across all tournaments.
      Inherits the deduplication of staging layer but focuses only on business logic keys and metric tracking.
    columns:
      - name: year
        description: "Year of the tournament"
      - name: tournament_id
        description: "ATP tournament identifier"
      - name: match_id
        description: "Standardized match identifier"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id"

  - name: fct_atp_key_stats
    description: >
      Incremental entity fact table for detailed point, serve, and break metrics per match-set.
      Extracts deeply embedded strings ("30/51 (59%)") into native analytical metrics (`_won`, `_played`, `_pct`).
      Includes derived metrics native to the Python processing engine such as `break_points_faced` and cross-references opponent serving values to deduce return points for Grand Slams.
      Only inserts rows where `meta_file_modified` is newer than the latest currently tracked.
    columns:
      - name: match_id
        description: "ATP match identifier"
      - name: set_number
        description: "Set index (0 for Match Overall, 1-5 for specific sets)"
      - name: meta_file_modified
        description: "Tracking timestamp utilized for incremental pipeline load"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id || '|' || set_number"
  - name: fct_atp_stroke_analysis
    description: >
      Entity fact table for point-level stroke analysis data.
      Classifies point_end_type into outcome categories (winner, forced_error, unforced_error, etc.),
      extracts game/point from point_id, and deduplicates to the latest file version per match point.
    columns:
      - name: match_id
        description: "ATP match identifier"
      - name: point_id
        description: "Unique point identifier within a match (format: set_game_point)"
      - name: outcome_category
        description: "Classified outcome: winner, forced_error, unforced_error, double_fault, ace, or other"
      - name: hand
        description: "Forehand or backhand"
      - name: shot_type
        description: "Type of shot played"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id || '|' || point_id"

  - name: fct_atp_court_vision
    description: >
      Entity fact table for point-level court vision data with per-stroke ball trajectory coordinates.
      Explodes 1-row-per-point into 1-row-per-shot, pivots trajectory positions (hit, peak_before_net,
      net, bounce, peak_after_net) to wide-format x/y/z columns. Includes match score state with
      tiebreak detection (including NextGen Finals 3-3 rule). Uses NULL for missing values,
      assigns ball_speed_kmh only on the serve stroke, and swaps x/y axes (y=0 at net).
    columns:
      - name: point_id
        description: "Court vision point identifier"
      - name: stroke_idx
        description: "1-indexed stroke within the point (1=serve, 2=return, etc.)"
      - name: is_tiebreak
        description: "Whether the point was played during a tiebreak (1=yes, 0=no)"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id || '|' || point_id || '|' || coalesce(cast(stroke_idx as varchar), '0')"

  - name: dim_atp_players
    description: >
      Dimension table of ATP players derived from key stats and tournament results staging models.
      Contains unique player records with ID, name (full/first/last), and country.
    columns:
      - name: player_id
        description: "Unique ATP player identifier"
        tests:
          - unique
          - not_null
      - name: player_name
        description: "Full display name"
      - name: first_name
        description: "First name (from key stats)"
      - name: last_name
        description: "Last name (from key stats)"
      - name: country
        description: "Country code (3-letter ISO)"

  - name: dim_atp_tournaments
    description: >
      Dimension table of ATP tournaments per year, combining calendar data
      (category, city, country, dates, winners) with tournaments API metadata
      (surface, draw sizes, prize money, indoor/outdoor).
    columns:
      - name: year
        description: "Calendar year of the tournament edition"
      - name: tournament_id
        description: "Unique ATP tournament identifier"
      - name: tournament_name
        description: "Official tournament name"
      - name: category
        description: "Tournament category (Grand Slam, ATP 1000, etc.)"
      - name: surface
        description: "Playing surface (Clay, Hard, Grass, etc.)"
      - name: indoor_outdoor
        description: "Whether the event is played indoors or outdoors"
      - name: total_financial_commitment
        description: "Total prize money commitment"
      - name: singles_draw_size
        description: "Number of players in the singles draw"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id"

  - name: dim_atp_matches
    description: >
      Dimension table of ATP matches. One row per match with player info,
      round, score, result, duration, and umpire.
    columns:
      - name: year
        description: "Calendar year"
      - name: tournament_id
        description: "Tournament identifier"
      - name: match_id
        description: "Match identifier"
      - name: round
        description: "Tournament round (R128, R64, R32, R16, QF, SF, F)"
      - name: score
        description: "Match score string"
      - name: winner_id
        description: "Player ID of the match winner"
      - name: sets_completed
        description: "Number of sets completed in the match"
      - name: duration_total
        description: "Total match duration"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id"
