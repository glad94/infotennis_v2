version: 2

sources:
  - name: infotennis_v2_raw
    database: infotennis_v2_raw
    schema: main
    tables:
      - name: atp_calendar_test
        description: >
          Raw ATP calendar data loaded from S3 JSON files.
          Each row represents one file load containing the full calendar as a JSON blob.
        columns:
          - name: data
            description: "JSON blob containing metadata and a list of tournament objects"
          - name: meta_file_name
            description: "S3 key / filename of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved (from metadata.retrieved_at)"
      - name: atp_tournaments
        description: >
          Raw ATP tournament detail data from the ATP Tour calendar API.
          Each row is one file load containing tournament surfaces, financials, draw sizes, etc.
        columns:
          - name: data
            description: "JSON blob containing metadata and TournamentDates array"
          - name: meta_file_name
            description: "S3 key / filename of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_tournament_results
        description: >
          Raw ATP tournament match results scraped from tournament results pages.
          Each row is one file load containing all matches for a given tournament.
        columns:
          - name: data
            description: "JSON blob containing metadata and array of match objects"
          - name: meta_file_name
            description: "S3 key / filename of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_match_info
        description: >
          Raw ATP match info data from the Hawkeye API.
          Each row is one file load containing data for a single match.
        columns:
          - name: data
            description: "JSON blob with match info payload"
          - name: meta_file_name
            description: "S3 key of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_key_stats
        description: >
          Raw ATP key stats data from the Infosys API.
          Each row is one file load containing per-set stats for a single match.
        columns:
          - name: data
            description: "JSON blob with encrypted/decrypted key stats payload"
          - name: meta_file_name
            description: "S3 key of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_stroke_analysis
        description: >
          Raw ATP stroke analysis data from the Infosys API.
          Each row is one file load with forehand/backhand shot outcomes per match.
        columns:
          - name: data
            description: "JSON blob with stroke analysis payload"
          - name: meta_file_name
            description: "S3 key of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_rally_analysis
        description: >
          Raw ATP rally analysis data from the Infosys API.
          Each row is one file load with point-by-point rally data per match.
        columns:
          - name: data
            description: "JSON blob with rally analysis payload"
          - name: meta_file_name
            description: "S3 key of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
      - name: atp_court_vision
        description: >
          Raw ATP court vision data from the Infosys API.
          Each row is one file load with ball tracking and point-level data per match.
        columns:
          - name: data
            description: "JSON blob with court vision payload (column names encoded)"
          - name: meta_file_name
            description: "S3 key of the source JSON file"
          - name: meta_file_modified
            description: "Timestamp when the file was retrieved"
