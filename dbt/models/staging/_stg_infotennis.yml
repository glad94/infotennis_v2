version: 2

models:
  - name: stg_atp_calendar
    description: >
      Flattened ATP calendar data. Each row is one tournament from one file version.
      Parsed from the raw JSON blob in infotennis_v2_raw.atp_calendar.
    columns:
      - name: tournament_id
        description: "ATP tournament identifier"
        tests:
          - not_null
      - name: meta_file_modified
        description: "Timestamp of the source file ingestion"
        tests:
          - not_null
      - name: year
        description: "Calendar year of the tournament"
      - name: tournament
        description: "Tournament name"
      - name: category
        description: "Tournament category"
      - name: city
        description: "Host city"
      - name: country
        description: "Host country"
      - name: dates
        description: "Tournament date range as text"
      - name: singles_winner
        description: "Singles winner name, empty string or null if not yet completed"
      - name: doubles_winner
        description: "Comma-separated doubles winners, null if not yet completed"
      - name: url
        description: "URL to tournament results page, null if tournament has not completed"
      - name: meta_file_name
        description: "Source S3 filename"
    tests:
      - unique:
          column_name: "tournament_id || '|' || meta_file_modified"

  - name: stg_atp_calendar_changes
    description: >
      Tournaments that need results scraped: either newly completed (url null->non-null)
      or currently ongoing (url contains '/current/').
    columns:
      - name: tournament_id
        description: "ATP tournament identifier"
        tests:
          - not_null
          - unique
      - name: url
        description: "URL to tournament results page"
        tests:
          - not_null
      - name: previous_meta_file_modified
        description: "Timestamp of the previous file version (null for ongoing)"
      - name: change_type
        description: "'newly_completed' or 'ongoing'"

  - name: stg_atp_tournaments
    description: >
      Flattened ATP tournament detail data from the most recent file load.
      Contains surfaces, financial commitments, draw sizes, and other attributes.
    columns:
      - name: tournament_id
        description: "ATP tournament identifier"
        tests:
          - not_null
          - unique
      - name: tournament_name
        description: "Tournament display name"
      - name: location
        description: "City and country string"
      - name: surface
        description: "Playing surface (Hard, Clay, Grass, Carpet)"
      - name: indoor_outdoor
        description: "Whether the event is Indoor or Outdoor"
      - name: total_financial_commitment
        description: "Total tournament financial commitment"
      - name: singles_draw_size
        description: "Number of players in singles draw"
      - name: doubles_draw_size
        description: "Number of teams in doubles draw"
      - name: event_type
        description: "Tournament tier/type code"

  - name: stg_atp_tournament_results
    description: >
      Flattened and deduplicated ATP tournament match results.
      Only the most recent version of each (year, tournament_id, match_id) is kept.
    columns:
      - name: match_id
        description: "ATP match identifier"
        tests:
          - not_null
      - name: tournament_id
        description: "ATP tournament identifier"
        tests:
          - not_null
      - name: year
        description: "Tournament year"
        tests:
          - not_null
      - name: round
        description: "Round name (e.g. Quarterfinals, Final)"
      - name: player1_name
        description: "Player 1 full name"
      - name: player1_id
        description: "Player 1 ATP ID"
      - name: player2_name
        description: "Player 2 full name"
      - name: player2_id
        description: "Player 2 ATP ID"
      - name: score
        description: "Match score string"
    tests:
      - unique:
          column_name: "year || '|' || tournament_id || '|' || match_id"

  - name: stg_atp_tournament_results_new
    description: >
      Newly added tournament results identified by comparing the two most recent
      file loads per tournament. Drives downstream match data retrieval.
    columns:
      - name: match_id
        description: "ATP match identifier of the new result"
        tests:
          - not_null
      - name: tournament_id
        description: "ATP tournament identifier"
        tests:
          - not_null

  - name: stg_atp_match_info
    description: >
      Staging model for ATP Match Info (Hawkeye API).
      Data is completely flattened from the Match structure out to the granularity of a single row per match.
    columns:
      - name: match_id
        description: "Formatted Match ID parsed from file name"
        tests:
          - not_null
      - name: year
        description: "Year of the tournament"
      - name: tournament_id
        description: "Tournament ID"

  - name: stg_atp_key_stats
    description: >
      Staging view for ATP Key Stats (Infosys API).
      Flattened to have one row per match set, extracting individual statistics by name (e.g. Aces, Winners) into explicit columns.
    columns:
      - name: match_id
        description: "Formatted Match ID parsed from file name"
        tests:
          - not_null
      - name: set_number
        description: "Set index (0 = Match summary, 1-5 = Sets 1-5)"

  - name: stg_atp_stroke_analysis
    description: >
      Staging view for ATP Stroke Analysis (Infosys API).
      Unnested point-level data. Every row is one point recorded in the `rallyShots.allPoints` array.
      
  - name: stg_atp_rally_analysis
    description: >
      Staging view for ATP Rally Analysis (Infosys API).
      Unnested point-level data segmented first by shot_group and outcome_type.
      
  - name: stg_atp_court_vision
    description: >
      Staging view for ATP Court Vision (Infosys API).
      Points-level data unnested from the `a50` Dictionary. Keeps variables encoded as `a<numeric>` formats.
      - name: meta_file_name
        description: "S3 key of the source file"
      - name: meta_file_modified
        description: "Retrieved timestamp from wrapper metadata"

  - name: stg_atp_stroke_analysis
    description: >
      Staging view for ATP Stroke Analysis (Infosys API).
      Extracts sets_completed, players, and rally_shots JSON.
    columns:
      - name: retrieved_at
        description: "UTC timestamp when the data was scraped"
      - name: sets_completed
        description: "Number of sets played"
      - name: players
        description: "JSON array with player IDs"
      - name: rally_shots
        description: "JSON with forehand/backhand shot outcomes per set"
      - name: meta_file_name
        description: "S3 key of the source file"
      - name: meta_file_modified
        description: "Retrieved timestamp from wrapper metadata"

  - name: stg_atp_rally_analysis
    description: >
      Staging view for ATP Rally Analysis (Infosys API).
      Extracts sets_completed, player_details, and rally_data JSON.
    columns:
      - name: retrieved_at
        description: "UTC timestamp when the data was scraped"
      - name: sets_completed
        description: "Number of sets played"
      - name: player_details
        description: "JSON array with player details"
      - name: rally_data
        description: "JSON with point-by-point rally outcomes"
      - name: meta_file_name
        description: "S3 key of the source file"
      - name: meta_file_modified
        description: "Retrieved timestamp from wrapper metadata"

  - name: stg_atp_court_vision
    description: >
      Staging view for ATP Court Vision (Infosys API).
      Extracts the courtVisionData array with encoded column names.
      See column mapping docs in the SQL file header.
    columns:
      - name: retrieved_at
        description: "UTC timestamp when the data was scraped"
      - name: court_vision_data
        description: "JSON array with encoded point-level tracking data"
      - name: meta_file_name
        description: "S3 key of the source file"
      - name: meta_file_modified
        description: "Retrieved timestamp from wrapper metadata"
